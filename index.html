<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>像素抽籤機</title>
  <meta name="description" content="像素風轉盤抽籤，支援放回 / 不放回模式 · Pixel-art picker wheel with keep / remove modes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>

  <header class="top">
    <h1 class="logo">
      <span class="logo-en">PIXEL DRAW</span>
      <span class="logo-zh" data-i18n="logoSub">像素抽籤機</span>
    </h1>
    <div class="top-actions">
      <button id="themeBtn" class="btn btn-lang" type="button"></button>
      <button id="langBtn" class="btn btn-lang" type="button" data-i18n="langBtn" data-i18n-attr="title:langTitle">EN</button>
      <button id="muteBtn" class="btn btn-icon" type="button" aria-pressed="false" data-i18n-attr="title:muteTitle">♪ ON</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage panel">
      <div class="wheel-wrap">
        <canvas id="wheel" width="300" height="300" data-i18n-attr="aria-label:wheelLabel"></canvas>
        <div class="mascot-wrap">
          <div id="bubble" class="bubble" role="status" aria-live="polite"></div>
          <canvas id="mascot" width="24" height="26" data-i18n-attr="title:mascotTitle"></canvas>
        </div>
      </div>

      <div class="stage-controls">
        <div class="mode" role="radiogroup" data-i18n-attr="aria-label:modeGroup">
          <label class="mode-opt">
            <input type="radio" name="mode" value="replace">
            <span data-i18n="modeReplace">放回</span>
          </label>
          <label class="mode-opt">
            <input type="radio" name="mode" value="noreplace">
            <span data-i18n="modeNoReplace">不放回</span>
          </label>
        </div>
        <p id="modeHint" class="hint"></p>
        <button id="spinBtn" class="btn btn-primary btn-big" type="button">開始抽籤</button>
        <p id="status" class="status"></p>
        <p class="hint" data-i18n-html="keyHint">點轉盤或按 <kbd>空白鍵</kbd> 也可以抽</p>
      </div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="list">名單</h2>
          <span id="count" class="tag">0 個</span>
        </div>
        <textarea id="entries" rows="9" spellcheck="false" data-i18n-attr="placeholder:placeholder"></textarea>
        <div class="row">
          <button id="shuffleBtn" class="btn" type="button" data-i18n="shuffle">打亂</button>
          <button id="sortBtn" class="btn" type="button" data-i18n="sort">排序</button>
          <button id="sampleBtn" class="btn" type="button" data-i18n="sample">範例</button>
          <button id="clearBtn" class="btn btn-danger" type="button" data-i18n="clear">清空</button>
        </div>
      </section>

      <section id="drawnPanel" class="panel">
        <div class="panel-head">
          <h2 data-i18n="drawn">已抽出</h2>
          <button id="resetBtn" class="btn btn-sm" type="button" data-i18n="resetDrawn">全部放回</button>
        </div>
        <ol id="drawnList" class="chips"></ol>
        <p id="drawnEmpty" class="empty" data-i18n="drawnEmpty">還沒有抽出任何項目</p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 data-i18n="history">紀錄</h2>
          <button id="clearHistBtn" class="btn btn-sm" type="button" data-i18n="clearHistory">清除</button>
        </div>
        <ol id="historyList" class="history"></ol>
        <p id="historyEmpty" class="empty" data-i18n="historyEmpty">轉一下就會留下紀錄</p>
      </section>
    </aside>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <p class="modal-kicker">WINNER!</p>
      <p id="modalName" class="modal-name"></p>
      <p id="modalNote" class="modal-note"></p>
      <div class="row row-center">
        <button id="againBtn" class="btn btn-primary" type="button" data-i18n="again">再抽一次</button>
        <button id="closeBtn" class="btn" type="button" data-i18n="close">關閉</button>
      </div>
    </div>
  </div>

  <canvas id="buddy" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script type="module" src="js/main.js"></script>
</body>
</html>
